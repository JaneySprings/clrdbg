name: Build

permissions:
  contents: read

on:
  push:
    tags:
      - '*'

env:
  DOTNET_VERSION: '10.x'

jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          # dotnet-quality: preview

      - name: Publish
        run: |
          for rid in osx-x64 osx-arm64 linux-x64 linux-arm64 win-x64 win-arm64; do
            dotnet publish DotNet.Debugging.Adapter/DotNet.Debugging.Adapter.csproj -c Release -r $rid
            (cd out/$rid && zip -qr ../clrdbg_$rid.zip .)
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clrdbg
          path: out/*.zip
          if-no-files-found: error

  remote-target:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build RemoteCoreClrTarget
        run: |
          DotNet.Debugging.Remote/Target/build-apple.sh
          DotNet.Debugging.Remote/Target/build-android.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RemoteCoreclrTarget
          path: |
            out/remote-target/**/*.so
            out/remote-target/**/*.dylib
            !out/remote-target/**/*.dSYM/**
          if-no-files-found: error

  remote-host:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: osx
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          # dotnet-quality: preview

      - name: Install linux-arm64 cross toolchain
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Publish
        run: |
          dotnet publish DotNet.Debugging.Remote/Host/DotNet.Debugging.Remote.csproj -c:Release -r:${{ matrix.platform }}-x64
          dotnet publish DotNet.Debugging.Remote/Host/DotNet.Debugging.Remote.csproj -c:Release -r:${{ matrix.platform }}-arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RemoteCoreclrHost-${{ matrix.platform }}
          path: |
            out/remote-host/**/*.so
            out/remote-host/**/*.dylib
            out/remote-host/**/*.dll
          if-no-files-found: error

  release:
    needs: [adapter, remote-target, remote-host]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download the adapter
        uses: actions/download-artifact@v4
        with:
          name: clrdbg
          path: dist

      - name: Download the remote target library
        uses: actions/download-artifact@v4
        with:
          name: RemoteCoreclrTarget
          path: remote/remote-target

      - name: Download the remote host libraries
        uses: actions/download-artifact@v4
        with:
          pattern: RemoteCoreclrHost-*
          merge-multiple: true
          path: remote/remote-host

      - name: Pack the remote libraries
        run: |
          find remote -type f | sort
          (cd remote && zip -qrD ../dist/RemoteCoreClrLibraries.zip remote-host remote-target)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          ls -la dist
          gh release create "$TAG_NAME" --title "$TAG_NAME" --latest dist/*.zip
