name: Build

permissions:
  contents: read

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

env:
  DOTNET_VERSION: '10.x'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::The tag ${GITHUB_REF#refs/tags/} does not point to a commit of main"; exit 1; }

  adapter:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          # dotnet-quality: preview

      - name: Publish
        run: |
          for rid in osx-x64 osx-arm64 linux-x64 linux-arm64 win-x64 win-arm64; do
            dotnet publish DotNet.Debugging.Adapter/DotNet.Debugging.Adapter.csproj -c Release -r $rid
            (cd out/$rid && zip -qr ../clrdbg_$rid.zip .)
          done

      - name: Publish (framework-dependent)
        run: |
          dotnet publish DotNet.Debugging.Adapter/DotNet.Debugging.Adapter.csproj -c Release --self-contained false
          (cd out/universal && zip -qr ../clrdbg_universal.zip .)

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clrdbg
          path: out/*.zip
          if-no-files-found: error

  remote-target:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build RemoteCoreClrTarget
        run: |
          DotNet.Debugging.Remote/Target/build-apple.sh
          DotNet.Debugging.Remote/Target/build-android.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RemoteCoreclrTarget
          path: |
            out/remote-target/**/*.so
            out/remote-target/**/*.dylib
            !out/remote-target/**/*.dSYM/**
          if-no-files-found: error

  remote-host:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: osx
          - os: windows-latest
            platform: win

    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          # dotnet-quality: preview

      - name: Install linux-arm64 cross toolchain
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Publish
        run: |
          dotnet publish DotNet.Debugging.Remote/Host/DotNet.Debugging.Remote.csproj -c:Release -r:${{ matrix.platform }}-x64
          dotnet publish DotNet.Debugging.Remote/Host/DotNet.Debugging.Remote.csproj -c:Release -r:${{ matrix.platform }}-arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RemoteCoreclrHost-${{ matrix.platform }}
          path: |
            out/remote-host/**/*.so
            out/remote-host/**/*.dylib
            out/remote-host/**/*.dll
          if-no-files-found: error

  release:
    needs: [adapter, remote-target, remote-host]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download the adapter
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clrdbg
          path: dist

      - name: Download the remote target library
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: RemoteCoreclrTarget
          path: remote/remote-target

      - name: Download the remote host libraries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: RemoteCoreclrHost-*
          merge-multiple: true
          path: remote/remote-host

      - name: Pack the remote libraries
        run: |
          find remote -type f | sort
          (cd remote && zip -qrD ../dist/RemoteCoreClrLibraries.zip remote-host remote-target)

      - name: Attest the provenance of the assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          ls -la dist
          gh release create "$TAG_NAME" --verify-tag --title "$TAG_NAME" --latest dist/*.zip
