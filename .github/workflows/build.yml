name: Build

permissions:
  contents: write

on:
  push:
    tags:
      - '*'
    branches:
      - main

env:
  DOTNET_VERSION: '10.x'

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          # dotnet-quality: preview

      - name: Publish
        run: |
          mkdir -p dist
          for rid in osx-x64 osx-arm64 linux-x64 linux-arm64 win-x64 win-arm64; do
            dotnet publish DotNet.Debugging.Adapter/DotNet.Debugging.Adapter.csproj -c Release -r $rid
            (cd out/$rid && zip -qr ../clrdbg_$rid.zip .)
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}

          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --latest
          
          for file in out/*.zip; do
            if [ -f "$file" ]; then
              echo "Uploading $file"
              gh release upload "$TAG_NAME" "$file"
            fi
          done
